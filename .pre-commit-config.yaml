# Local backend checks, in the pip-based .venv (ruff/ty via backend/.venv/bin).
# Requires pre-commit: uv tool install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && .venv/bin/ruff check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: backend-ty
        name: ty type check (backend)
        entry: bash -c 'cd backend && .venv/bin/ty check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: backend-compileall
        name: compileall (backend)
        entry: bash -c 'cd backend && .venv/bin/python -m compileall -q bgmon_api/'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$