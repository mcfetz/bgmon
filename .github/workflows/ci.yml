name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bgmon_test
          POSTGRES_USER: bgmon
          POSTGRES_PASSWORD: bgmon
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint backend
        working-directory: ./backend
        run: ruff check bgmon_api

      - name: Type-check backend
        working-directory: ./backend
        continue-on-error: true
        run: ty check bgmon_api

      - name: Run backend tests
        working-directory: ./backend
        env:
          BGMON_DATABASE_URL: postgresql://bgmon:bgmon@localhost:5432/bgmon_test
          BGMON_SECRET_KEY: test-secret
        run: |
          pytest tests/test_libre_data.py tests/test_alarm_evaluator.py tests/test_auth.py \
            tests/test_notification_profiles.py tests/test_users_api.py tests/test_settings_api.py \
            tests/test_log_api.py tests/test_leader_election.py tests/test_twilio_caller.py \
            tests/test_web_push.py tests/test_dashboard.py tests/test_shifts_night_family.py \
            tests/test_compression_detector.py tests/test_smart_alerts.py \
            -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # cache disabled — stale modules cause prettier version mismatches

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Sync SvelteKit
        working-directory: ./frontend
        run: npx svelte-kit sync

      - name: Type-check frontend
        working-directory: ./frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BGMON_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [backend, frontend, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy app via Portainer webhook
        env:
          PORTAINER_APP_WEBHOOK_URL: ${{ secrets.PORTAINER_APP_WEBHOOK_URL }}
        run: |
          _url="$(printf '%s' "$PORTAINER_APP_WEBHOOK_URL" | tr -d '[:space:]')"
          if [[ -z "$_url" ]]; then
            echo "::notice::Skipping app deployment: Portainer webhook is not configured."
            exit 0
          fi
          if [[ ! "$_url" =~ ^https?:// ]]; then
            echo "::warning::PORTAINER_APP_WEBHOOK_URL does not look like https:// — skipping deploy (length ${#_url})."
            exit 0
          fi
          curl -fsS -X POST "$_url"
          echo "Portainer app redeploy triggered."

      - name: Deploy scheduler via Portainer webhook
        env:
          PORTAINER_SCHEDULER_WEBHOOK_URL: ${{ secrets.PORTAINER_SCHEDULER_WEBHOOK_URL }}
        run: |
          _url="$(printf '%s' "$PORTAINER_SCHEDULER_WEBHOOK_URL" | tr -d '[:space:]')"
          if [[ -z "$_url" ]]; then
            echo "::notice::Skipping scheduler deployment: Portainer webhook is not configured."
            exit 0
          fi
          if [[ ! "$_url" =~ ^https?:// ]]; then
            echo "::warning::PORTAINER_SCHEDULER_WEBHOOK_URL does not look like https:// — skipping deploy (length ${#_url})."
            exit 0
          fi
          curl -fsS -X POST "$_url"
          echo "Portainer scheduler redeploy triggered."
